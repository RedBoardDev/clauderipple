# Publish to npm when a release tag is pushed.
#
# `git tag vX.Y.Z && git push origin vX.Y.Z` is the whole release once the version bump is on main
# (docs/RELEASE.md). Authentication is npm trusted publishing: the job proves it is this workflow
# in this repository with a GitHub OIDC token, so there is no npm token to store and no browser
# 2FA step. npmjs.com → clauderipple → Settings → Trusted Publisher must name
# PBJ-2 / clauderipple / publish.yml; npm checks that only at publish time.
#
# Run it by hand (Actions → Publish → Run workflow) to check a commit without publishing: a manual
# run packs with --dry-run.

name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # The tray's Electron is only a type dependency at build time; its ~270MB binary is not needed.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1

      - run: npm ci

      - name: Tag matches every version
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in package.json packages/router/package.json packages/cli/package.json packages/app/package.json; do
            v=$(node -p "require('./$f').version")
            [ "$v" = "$tag" ] || { echo "::error::$f is $v, tag is v$tag"; exit 1; }
          done
          grep -q "VERSION = \"$tag\"" packages/router/src/version.ts || { echo "::error::packages/router/src/version.ts is not $tag"; exit 1; }

      - run: npm run typecheck
      - run: npm run check:mod
      - run: npm test

      # What npm will publish, installed into an empty prefix and inspected: a tarball that is
      # missing dist/ installs a command that cannot run, and the published package is the only
      # artifact nobody can test by reading it afterwards (G-D13). Nothing here starts the CLI or
      # touches an installation; the version-tag check above already ties the tarball to the tag.
      - name: Packed tarball carries everything an install runs
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          npm pack --silent
          tgz="$(ls clauderipple-*.tgz | head -n 1)"
          npm install --prefix "$tmp/lib" --no-audit --no-fund --ignore-scripts "./$tgz" >/dev/null
          root="$tmp/lib/node_modules/clauderipple"
          for file in bin/clauderipple.js dist/cli/src/index.js dist/router/src/index.js \
                      dist/ui/index.html dist/mod/hooks/register.tsx dist/app/dist/main.js; do
            [ -f "$root/$file" ] || { echo "::error::$file is missing from the published package"; exit 1; }
          done
          node -e "const p=require('$root/package.json'); if(p.bin?.clauderipple!=='bin/clauderipple.js') { console.error('::error::the package bin is not the CLI'); process.exit(1) }"

      - name: Publish
        if: github.event_name == 'push'
        run: npm publish

      - name: Pack (manual run, nothing published)
        if: github.event_name != 'push'
        run: npm publish --dry-run
